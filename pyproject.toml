[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-brain"
version = "0.1.0"
description = "Generic context, evidence, memory, retrieval, and knowledge infrastructure for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-brain = "agent_brain.cli.main:run"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/connectors/repository_neutral"]
