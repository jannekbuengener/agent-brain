name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    env:
      AGENT_BRAIN_SURREAL_ENDPOINT: http://127.0.0.1:8010

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Start isolated SurrealDB 3.0.4 scratch
        # Disposable memory engine only — never Claire/unknown volumes (#38/#89).
        run: |
          docker run -d --name agent-brain-surreal-scratch \
            -p 8010:8000 \
            surrealdb/surrealdb@sha256:65000ff205b08363b035b457f292dc0a0b1cd4212935dd5ea94073cf67adf306 \
            start --bind 0.0.0.0:8000 --unauthenticated memory
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8010/version | grep -q 'surrealdb-3.0'; then
              curl -s http://127.0.0.1:8010/version
              exit 0
            fi
            sleep 1
          done
          docker logs agent-brain-surreal-scratch || true
          exit 1

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # Includes #17 distribution gates (tests/distribution/) and #12
        # CLI/protocol gates (tests/protocol/, tests/cli/): installability,
        # version parity, contract shape, consumer smoke, core-without-MCP.
        # Also runs #64/#89 Surreal improvement live acceptance against scratch.
        run: python -m pytest -q
